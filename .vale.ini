# Vale checks the prose rules in docs/style.md that a tool can check (its last table says which). The
# haruspex style is the only one: spelling is cspell's job (cspell.json), and Vale's built-in styles are
# not used.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Markdown, and the comments in C# (Vale reads //, /* */ and /// comments, not strings or identifiers).
[*.{md,cs}]
BasedOnStyles = haruspex

# The style guide quotes the words and punctuation it rules out, so these four rules would flag every quotation.
# Its headings and the tool's name are still checked.
[docs/style.md]
haruspex.Hype = NO
haruspex.Minimisers = NO
haruspex.Terms = NO
haruspex.Punctuation = NO
