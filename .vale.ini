# Vale checks the prose rules in docs/style.md that a tool can check (its last table says which). The
# haruspex style is the only one: spelling is cspell's job (cspell.config.yaml), with
# haruspex.Spelling for the American forms its dictionaries accept, and Vale's built-in styles are
# not used.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Markdown, and the comments in C# (Vale reads //, /* */ and /// comments, not strings or identifiers).
[*.{md,cs}]
BasedOnStyles = haruspex

# The style guide quotes the words, punctuation and history it rules out, and states the rule about the tool's
# name with the name first, so these rules would flag every quotation. Its headings and the name's case are
# still checked.
[docs/style.md]
haruspex.History = NO
haruspex.Hype = NO
haruspex.Minimisers = NO
haruspex.Terms = NO
haruspex.Punctuation = NO
haruspex.ToolNameStart = NO
