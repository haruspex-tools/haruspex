# cspell checks the spelling of the Markdown, the C# (comments, strings and identifiers) and the workflows, in
# British English (docs/style.md, "Spelling"). tests/prose/check.sh runs it, over the files it lists.
version: "0.2"
language: en-GB

# The vendored corpus is Microsoft's, kept byte for byte (tests/corpus/README.md), so its spelling is not ours to judge
# or fix. check.sh leaves it out of the files it lists; this keeps it out of any other cspell run too.
ignorePaths:
  - tests/corpus/sql-server-samples/**

dictionaryDefinitions:
  - name: haruspex
    path: ./.cspell/words.txt
    addWords: true
dictionaries:
  - haruspex

# British spelling (docs/style.md, "Spelling"). The en-GB dictionary accepts the Oxford -ize forms, and the
# software dictionaries cspell adds for code accept American ones, in strings too. Vale refuses them in prose by
# pattern (haruspex.Spelling), but Vale doesn't read C# strings, which hold the diagnostics and the generated
# code's comments. So cspell refuses these, wherever they appear: the -ize and -yze forms of the verbs a
# technical text uses, and the common American forms with no -ize.
