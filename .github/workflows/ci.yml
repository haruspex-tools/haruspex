name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand, from the Actions page or `gh workflow run CI --ref main`: the one run whose binaries and npm tarballs are
  # handed out (ARTIFACTS below).
  workflow_dispatch:

# Read-only: this workflow builds and tests, and never writes to the repository.
permissions:
  contents: read

# A new run cancels the one before it on the same branch or pull request; the event is in the group so that a push to main
# never cancels a run dispatched by hand there, whose artifacts are the ones handed out.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# What the native and npm jobs' artifacts are called and how long they are kept. The jobs pass the binaries and the tarballs
# to each other as artifacts, so every run uploads them; but an artifact of a public repository can be downloaded by anyone
# signed in to GitHub, and the README tells users to install the tarballs. So only a run dispatched by hand on main uploads
# them under the names the README gives, kept 30 days. Every other run's have a name of its own, kept a day: a pull
# request's are built from code no one has reviewed yet (`unreviewed-pr-`), and a push's are main's but not handed out
# until a maintainer dispatches a run (`ci-`). ARTIFACTS is the prefix, empty for the handed-out run; it is written with
# the empty case last, since `&&` and `||` treat an empty string as false.
env:
  ARTIFACTS: >-
    ${{ (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main')
    && (github.event_name == 'pull_request' && 'unreviewed-pr-' || 'ci-') || '' }}
  ARTIFACT_DAYS: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && 30 || 1 }}

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    # Built and unit-tested on each platform haruspex runs on, since its output must be the same bytes on each. The
    # differential tests need SQL Server's container, whose image is Linux and x64 only, so they run on Linux alone.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Includes pulling the SQL Server image (about 1.5 GB) on Linux; Windows builds slowest.
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # Fail, rather than skip, the test that type-checks the generated Zod if Node is missing.
      HARUSPEX_REQUIRE_NODE: "1"
      # Fail, rather than skip, the tests over the fetched corpora if one is missing; they are fetched below.
      HARUSPEX_REQUIRE_CORPORA: "1"
    steps:
      # Actions are pinned to commit SHAs, not tags, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Locked mode (set in Directory.Build.props on CI): fails if a packages.lock.json is out of date.
      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      # The build already fails on a style rule; this also catches what only the formatter sees (whitespace in
      # files the build does not analyse the same way, such as linked sources), and says which file to fix. The
      # files are the same on every platform (.gitattributes keeps them LF), so once is enough.
      - run: dotnet format --no-restore --verify-no-changes
        if: runner.os == 'Linux'

      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/emit-check

      # typescript-eslint needs TypeScript's JavaScript API, so the lint of the generated Zod has its own package.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/emit-lint

      # The example application, compiled against the module committed beside it; ExampleAppTests also checks that the
      # module is what haruspex generates today.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/greenhouse

      - run: npm run check
        working-directory: examples/greenhouse

      # The public corpora that are fetched rather than vendored (tests/corpus/README.md), cached under a key made from
      # their manifest, so they are fetched again only when it changes. The script checks every file against the
      # manifest's SHA-256 even when the cache is restored, and fetches again what doesn't match, as do the tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/haruspex/corpora
          key: corpora-${{ runner.os }}-${{ hashFiles('tests/corpus/fetched.json') }}

      - run: node tests/corpus/fetch.mjs

      # Every test project. HARUSPEX_REQUIRE_SQLSERVER fails, rather than skips, the differential tests if SQL Server
      # cannot be started. HARUSPEX_TEST_SQLSERVER is not set, so they use Testcontainers with the runner's Docker.
      - run: dotnet test --no-build --configuration Release
        if: runner.os == 'Linux'
        env:
          HARUSPEX_REQUIRE_SQLSERVER: "1"

      # The unit tests alone: Windows runners' Docker runs Windows containers, and macOS runners have none.
      - run: dotnet test --no-build --configuration Release --project tests/Haruspex.Tests/Haruspex.Tests.csproj
        if: runner.os != 'Linux'

  native:
    name: Native binary (${{ matrix.rid }})
    # The command line compiled ahead of time for each platform, so that a change which breaks trimming or Native AOT fails
    # here rather than at a release. Each binary then checks the example's committed module, which runs every step from
    # reading the project to comparing the IR, and is kept as an artifact of the run with the licences that must go with
    # it (packaging/licenses/README.md). Not a release: nothing is published to a registry.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          # Each platform the npm packages ship a binary for is built on its own machine, since Native AOT doesn't compile
          # for another OS and needs a sysroot for another CPU. Arm64 Linux runners serve private repositories since
          # January 2026; macos-15-intel is the last Intel macOS image, supported until autumn 2027.
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Native AOT links with the platform's toolchain: clang on Linux (and zlib's headers), Xcode on macOS and the C++
      # build tools on Windows, which those runners have already.
      - run: sudo apt-get update -q && sudo apt-get install -y -q clang zlib1g-dev
        if: runner.os == 'Linux'

      # The locked restore first (locked on CI, as in build-and-test): it checks every package the command is built from
      # against the committed lock files, content hashes included, and leaves the checked copies in the packages folder,
      # where the publish's restore finds them.
      - run: dotnet restore src/Haruspex.Cli

      # The AOT compiler and the runtime pack it links come as packages per platform, whose version is the SDK's: the
      # newest patch of global.json's feature band that setup-dotnet finds, since global.json rolls forward to the latest
      # patch, so a later SDK brings a later compiler and runtime. The committed lock files don't list them, since an
      # ordinary build doesn't need them, and the runtime identifier changes every lock file, so this restore can't be
      # locked (src/Haruspex.Cli/Haruspex.Cli.csproj says more); everything but those packs was checked above. Trim and AOT
      # warnings are errors, as every warning is. The publish also puts the licences beside the binary. The platform comes
      # in through the environment, so that no expression is expanded into the script.
      - run: >-
          dotnet publish src/Haruspex.Cli --configuration Release --runtime "$RID"
          -p:HaruspexNativeAot=true -p:RestoreLockedMode=false --output publish
        env:
          RID: ${{ matrix.rid }}

      - run: ../../publish/haruspex check
        working-directory: examples/greenhouse

      # The binary with its licences; npm-pack refuses one without them. The artifact's root is publish/, the paths'
      # common folder, so it holds haruspex (or haruspex.exe), LICENSE and licenses/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACTS }}haruspex-${{ matrix.rid }}
          path: |
            publish/haruspex
            publish/haruspex.exe
            publish/LICENSE
            publish/licenses/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_DAYS }}

  npm-pack:
    name: Pack the npm tarballs
    # The npm packages (packaging/npm/README.md) made from the binaries the native jobs built, kept as one artifact, so a
    # private application can install haruspex from the files. Not a release: nothing is published to a registry.
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # This run's native artifacts, each into a folder of its own name, then renamed haruspex-<rid> without the run's
      # prefix, as the pack script reads them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.ARTIFACTS }}haruspex-*-*
          path: downloaded

      - run: |
          mkdir binaries
          for artifact in downloaded/*; do mv "$artifact" "binaries/${artifact#downloaded/"$ARTIFACTS"}"; done
          ls binaries

      # The version comes from the commit checked out, which the script checks each binary was built from; it also
      # refuses a binary whose artifact lacks a licence that must go with it.
      - run: node packaging/npm/pack.mjs --binaries binaries --out npm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACTS }}haruspex-npm
          path: npm/*.tgz
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_DAYS }}

  npm-install:
    name: Install the npm tarballs (${{ matrix.platform }})
    # The tarballs installed as an application would install them, into an empty project outside the checkout, and the
    # command run through npx: a launcher that can't find its binary, or a package without one, fails here.
    needs: npm-pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # For the fixture the command runs on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The name npm-pack uploaded under, from the same ARTIFACTS.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACTS }}haruspex-npm
          path: ${{ runner.temp }}/npm

      # The main package and this platform's, as the README's Install section says. Offline, so npm never asks the
      # registry for the other platform packages, which aren't published; it skips them, since they are optional. These
      # are this run's own tarballs, so zizmor's concern (a package from outside a lockfile) doesn't arise. Paths are
      # relative because Windows' are written with backslashes, which bash would read as escapes in a glob.
      - name: Install into an empty project
        working-directory: ${{ runner.temp }}
        run: | # zizmor: ignore[adhoc-packages]
          mkdir app
          cd app
          npm init -y > /dev/null
          npm install --offline --ignore-scripts --no-audit --no-fund ../npm/haruspex-0.0.0-*.tgz "../npm/haruspex.tools-$PLATFORM-"*.tgz
          ls "node_modules/@haruspex.tools"
        env:
          PLATFORM: ${{ matrix.platform }}

      # --no: run the command installed in the project, never one fetched from the registry; and -- before it, or npx reads
      # --version as its own. The version ends in the commit the binary was built from, which must be this run's.
      - name: Run the command
        working-directory: ${{ runner.temp }}/app
        run: |
          npx --no -- haruspex --version | tee version.txt
          grep -q "+$GITHUB_SHA" version.txt
          npx --no -- haruspex generate "$GITHUB_WORKSPACE/tests/fixtures/orders/database" --include 'sales.*' --out db
          test -s db/haruspex.ir.json
          test -s db/haruspex.zod.ts

  workflows:
    name: Lint the workflows
    # Two linters with different jobs: actionlint checks that the workflows are correct (syntax, expressions,
    # runner labels, and the shell in each `run:` through shellcheck); zizmor checks that they are safe (template
    # injection, persisted credentials, unpinned actions, excessive permissions).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by image digest, the Docker equivalent of a commit SHA.
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Offline, so a run depends only on this commit; and no SARIF upload, which would need write permission.
          online-audits: false
          advanced-security: false

  prose:
    name: Check the prose
    # The checks docs/style.md assigns to tools: spelling (cspell), the house style (Vale) and Mermaid diagrams
    # that parse. tests/prose/check.sh runs each, as it does locally; each first checks itself against fixtures.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # cspell, Mermaid and jsdom, at the versions in the committed lockfile, with no install scripts run.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/prose

      - run: tests/prose/check.sh spelling

      # Vale runs from its Docker image, pinned by digest in check.sh, with no network.
      - run: tests/prose/check.sh style
        if: ${{ !cancelled() }}

      - run: tests/prose/check.sh diagrams
        if: ${{ !cancelled() }}
